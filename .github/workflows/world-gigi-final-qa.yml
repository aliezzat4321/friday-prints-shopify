name: World of GiGi Final QA

on:
  push:
    branches: [friday-build]
    paths-ignore:
      - '.world-gigi-final.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: friday-build
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install playwright@1.55.0 >/dev/null 2>&1
      - run: sleep 20
      - name: Verify final composition
        env:
          STORE_URL: https://tm06px8w771tm2dd-108268650782.shopifypreview.com
        run: |
          cat > final.mjs <<'EOF'
          import { chromium } from 'playwright'; import fs from 'node:fs';
          fs.mkdirSync('world-gigi-final',{recursive:true});
          const browser=await chromium.launch({headless:true,executablePath:fs.existsSync('/usr/bin/google-chrome')?'/usr/bin/google-chrome':undefined});
          const views=[['desktop',1440,1000,3],['tablet',820,1180,2],['mobile',390,844,2]]; const out=[]; let pass=true;
          for(const [name,w,h,cols] of views){
            const ctx=await browser.newContext({viewport:{width:w,height:h},deviceScaleFactor:1}); const page=await ctx.newPage();
            await page.goto(`${process.env.STORE_URL}/pages/about?final=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForLoadState('networkidle',{timeout:20000}).catch(()=>{}); await page.waitForTimeout(1000);
            const m=await page.evaluate(()=>{
              const g=document.querySelector('.fp-world__gallery'); const cards=[...document.querySelectorAll('.fp-world-card')];
              const gs=getComputedStyle(g); const b=getComputedStyle(g,'::before');
              const r=e=>{const x=e.getBoundingClientRect();return {x:+x.x.toFixed(1),y:+x.y.toFixed(1),w:+x.width.toFixed(1),h:+x.height.toFixed(1)}};
              return {display:gs.display,grid:gs.gridTemplateColumns,signoff:b.content,signoffDisplay:b.display,signoffAlign:b.alignItems,cards:cards.map(r),broken:[...g.querySelectorAll('img')].filter(i=>!i.complete||!i.naturalWidth).length,overflow:document.documentElement.scrollWidth>innerWidth+2,title:document.querySelector('.fp-page-title')?.textContent?.trim(),hero:r(document.querySelector('.fp-page-hero')),gigi:r(document.querySelector('.fp-world__gigi'))};
            });
            const actual=(m.grid||'').split(' ').filter(Boolean).length; const ok=m.display==='grid'&&actual===cols&&(m.signoff||'').includes('still wandering')&&m.broken===0&&!m.overflow&&m.title==='world of GiGi'; if(!ok)pass=false;
            out.push({name,w,h,cols,actual,ok,m});
            await page.locator('.fp-page-hero').screenshot({path:`world-gigi-final/${name}-hero.png`});
            await page.locator('.fp-world__story').screenshot({path:`world-gigi-final/${name}-story.png`});
            await page.locator('.fp-world__gallery-head').screenshot({path:`world-gigi-final/${name}-gallery-head.png`});
            await page.locator('.fp-world__gallery').screenshot({path:`world-gigi-final/${name}-gallery.png`}); await ctx.close();
          }
          await browser.close(); fs.writeFileSync('.world-gigi-final.json',JSON.stringify({pass,run_id:Number(process.env.GITHUB_RUN_ID),source_sha:process.env.GITHUB_SHA,out},null,2)); if(!pass)process.exitCode=1;
          EOF
          node final.mjs
      - name: Record result
        if: always()
        run: |
          test -f .world-gigi-final.json || echo '{"pass":false,"error":"no result"}' > .world-gigi-final.json
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .world-gigi-final.json; git commit -m 'Record final World of GiGi QA [skip ci]' || exit 0
          git pull --rebase origin friday-build; git push origin HEAD:friday-build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-gigi-final
          path: world-gigi-final/
          retention-days: 1
