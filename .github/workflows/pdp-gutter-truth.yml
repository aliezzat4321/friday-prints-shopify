name: PDP Gutter Truth
on:
  push:
    branches: [friday-build]
    paths-ignore: ['.pdp-gutter-truth.json']
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {ref: friday-build}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: npm install playwright@1.55.0 >/dev/null 2>&1
      - run: sleep 20
      - name: Measure gutters
        run: |
          cat > qa.mjs <<'EOF'
          import { chromium } from 'playwright'; import fs from 'node:fs';
          const browser=await chromium.launch({headless:true,executablePath:fs.existsSync('/usr/bin/google-chrome')?'/usr/bin/google-chrome':undefined});
          const out=[]; let pass=true;
          for(const [w,h] of [[390,844],[320,700]]){
            const ctx=await browser.newContext({viewport:{width:w,height:h},deviceScaleFactor:1});
            const page=await ctx.newPage();
            await page.goto('https://tm06px8w771tm2dd-108268650782.shopifypreview.com/products/a-different-seoul-still-her-a3?truth='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForLoadState('networkidle',{timeout:20000}).catch(()=>{}); await page.waitForTimeout(1000);
            const m=await page.evaluate(()=>{
              const list=document.querySelector('.fp-pdp__media-list'); const media=document.querySelector('.fp-pdp__media'); const img=document.querySelector('.fp-pdp__media img');
              const rr=e=>{const r=e?.getBoundingClientRect();return r?{x:+r.x.toFixed(1),width:+r.width.toFixed(1),right:+r.right.toFixed(1)}:null};
              const mr=rr(media); return {viewport:innerWidth,list:rr(list),media:mr,img:rr(img),leftGutter:mr?+mr.x.toFixed(1):null,rightGutter:mr?+(innerWidth-mr.right).toFixed(1):null,patchLoaded:[...document.styleSheets].some(s=>(s.href||'').includes('friday-patches.css'))};
            });
            const ok=!!m.media && Math.abs(m.leftGutter-20)<=2 && Math.abs(m.rightGutter-20)<=2;
            if(!ok) pass=false; out.push({w,h,ok,m});
            await page.screenshot({path:`pdp-${w}.png`,fullPage:false}); await ctx.close();
          }
          await browser.close(); fs.writeFileSync('.pdp-gutter-truth.json',JSON.stringify({pass,out},null,2)); if(!pass) process.exitCode=1;
          EOF
          node qa.mjs
      - name: Record result
        if: always()
        run: |
          test -f .pdp-gutter-truth.json || echo '{"pass":false,"error":"no result"}' > .pdp-gutter-truth.json
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .pdp-gutter-truth.json; git commit -m 'Record PDP gutter truth [skip ci]' || exit 0
          git pull --rebase origin friday-build; git push origin HEAD:friday-build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdp-gutter-truth
          path: 'pdp-*.png'
          retention-days: 1
