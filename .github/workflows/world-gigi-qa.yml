name: World of GiGi QA

on:
  push:
    branches: [friday-build]
    paths-ignore:
      - '.world-gigi-qa.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: friday-build
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install playwright@1.55.0 >/dev/null 2>&1
      - run: sleep 24
      - name: Render World of GiGi
        env:
          STORE_URL: https://tm06px8w771tm2dd-108268650782.shopifypreview.com
        run: |
          cat > world-gigi-qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          fs.mkdirSync('world-gigi-qa',{recursive:true});
          const browser=await chromium.launch({headless:true,executablePath:fs.existsSync('/usr/bin/google-chrome')?'/usr/bin/google-chrome':undefined});
          const views=[['desktop-1440',1440,1000],['laptop-1280',1280,800],['tablet-820',820,1180],['mobile-390',390,844],['mobile-320',320,700]];
          const out=[]; let pass=true;
          for(const [name,w,h] of views){
            const ctx=await browser.newContext({viewport:{width:w,height:h},deviceScaleFactor:1});
            const page=await ctx.newPage();
            await page.goto(`${process.env.STORE_URL}/pages/about?gigiqa=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForLoadState('networkidle',{timeout:20000}).catch(()=>{});
            await page.waitForTimeout(1200);
            const m=await page.evaluate(()=>{
              const hero=document.querySelector('.fp-content-page--about .fp-page-hero');
              const title=document.querySelector('.fp-content-page--about .fp-page-title');
              const gigi=document.querySelector('.fp-world__gigi');
              const gallery=document.querySelector('.fp-world__gallery');
              const cards=[...document.querySelectorAll('.fp-world-card')];
              const imgs=cards.map(c=>c.querySelector('img')).filter(Boolean);
              const rect=e=>{const r=e?.getBoundingClientRect();return r?{x:+r.x.toFixed(1),y:+r.y.toFixed(1),w:+r.width.toFixed(1),h:+r.height.toFixed(1),right:+r.right.toFixed(1),bottom:+r.bottom.toFixed(1)}:null};
              const gs=gallery?getComputedStyle(gallery):null;
              return {
                cssLoaded:[...document.styleSheets].some(s=>(s.href||'').includes('friday-world-v3.css')),
                title:title?.textContent?.trim(),hero:rect(hero),gigi:rect(gigi),gallery:rect(gallery),
                galleryDisplay:gs?.display,overflowX:gs?.overflowX,
                cardCount:cards.length,cards:cards.map(rect),
                broken:imgs.filter(i=>!i.complete||!i.naturalWidth).length,
                overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2,
                storyLast:getComputedStyle(document.querySelector('.fp-world__copy p:last-child')||document.body).fontSize
              };
            });
            let composition=false;
            if(w>1000){ composition=m.galleryDisplay==='grid' && m.cards[0]?.w>m.cards[1]?.w && m.cards[1]?.y>m.cards[0]?.y && m.cards[2]?.y>m.cards[0]?.y; }
            else if(w>=750){ composition=m.galleryDisplay==='grid' && m.cards[0]?.w>m.cards[1]?.w; }
            else { composition=m.galleryDisplay==='flex' && m.cards[0]?.w>w*.65 && m.cards[0]?.w<w*.85; }
            const ok=m.cssLoaded && m.title==='world of GiGi' && m.cardCount===5 && m.broken===0 && !m.overflow && composition && m.storyLast!=='16px';
            if(!ok) pass=false;
            out.push({name,w,h,ok,m,composition});
            await page.screenshot({path:`world-gigi-qa/${name}-viewport.png`,fullPage:false});
            for(const [label,sel] of [['hero','.fp-content-page--about .fp-page-hero'],['story','.fp-world__story'],['gallery-head','.fp-world__gallery-head'],['gallery','.fp-world__gallery']]){
              const loc=page.locator(sel); if(await loc.count()) await loc.screenshot({path:`world-gigi-qa/${name}-${label}.png`});
            }
            await ctx.close();
          }
          await browser.close();
          fs.writeFileSync('.world-gigi-qa.json',JSON.stringify({pass,run_id:Number(process.env.GITHUB_RUN_ID),source_sha:process.env.GITHUB_SHA,out},null,2));
          if(!pass) process.exitCode=1;
          EOF
          node world-gigi-qa.mjs
      - name: Record result
        if: always()
        run: |
          test -f .world-gigi-qa.json || echo '{"pass":false,"error":"no result"}' > .world-gigi-qa.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .world-gigi-qa.json
          git commit -m 'Record World of GiGi QA [skip ci]' || exit 0
          git pull --rebase origin friday-build
          git push origin HEAD:friday-build
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-gigi-qa
          path: world-gigi-qa/
          retention-days: 2
