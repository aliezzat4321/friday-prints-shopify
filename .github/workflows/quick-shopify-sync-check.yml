name: Quick Shopify Sync Check

on:
  push:
    branches: [friday-build]
    paths-ignore:
      - '.shopify-sync-status.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: friday-build
      - name: Check connected preview for slim Friday at Home
        shell: bash
        run: |
          set -u
          sleep 20
          URL='https://il1m2791s4dmofov-108268650782.shopifypreview.com/?sync_check=${{ github.sha }}'
          STATUS='FETCH_FAILED'
          BYTES=0
          if curl -LfsS --retry 3 --retry-delay 2 -A 'Mozilla/5.0' "$URL" -o /tmp/storefront.html; then
            BYTES=$(wc -c </tmp/storefront.html | tr -d ' ')
            if grep -q -- '--fp-at-home-height:340px' /tmp/storefront.html; then
              STATUS='SYNC_OK'
            elif grep -q 'minmax(220px,.56fr)' /tmp/storefront.html; then
              STATUS='SYNC_STALE'
            else
              STATUS='SYNC_UNKNOWN'
            fi
          fi
          cat > .shopify-sync-status.json <<EOF
          {
            "status": "$STATUS",
            "source_sha": "${{ github.sha }}",
            "checked_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "bytes": $BYTES
          }
          EOF
          cat .shopify-sync-status.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .shopify-sync-status.json
          git commit -m 'Record Shopify sync status [skip ci]' || exit 0
          git push origin HEAD:friday-build
