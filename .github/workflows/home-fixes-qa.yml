name: Homepage Design System QA

on:
  push:
    branches: [friday-build]
    paths-ignore:
      - '.home-fixes-status.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  home-design-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: friday-build
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright package
        run: npm install playwright@1.55.0 >/dev/null 2>&1
      - name: Allow Shopify preview sync
        run: sleep 35
      - name: Audit homepage design system
        env:
          STORE_URL: https://ygv356jws4gmk7hs-108268650782.shopifypreview.com
        run: |
          cat > home-fixes-qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const executablePath = fs.existsSync('/usr/bin/google-chrome') ? '/usr/bin/google-chrome' : undefined;
          const browser = await chromium.launch({ headless:true, executablePath });
          const page = await browser.newPage({ viewport:{ width:1440, height:1000 } });
          const response = await page.goto(`${process.env.STORE_URL}/?home_design_qa=${Date.now()}`, { waitUntil:'domcontentloaded', timeout:60000 });
          await page.waitForLoadState('networkidle', { timeout:25000 }).catch(() => {});
          await page.evaluate(async()=>{ if(document.fonts?.ready) await document.fonts.ready; }).catch(()=>{});
          await page.waitForTimeout(1200);

          const initial = await page.evaluate(() => {
            const inspect = (selector) => {
              const el = document.querySelector(selector);
              if (!el) return null;
              const s = getComputedStyle(el);
              return {
                text: el.textContent.trim().replace(/\s+/g,' '),
                fontFamily: s.fontFamily,
                fontSize: s.fontSize,
                textTransform: s.textTransform,
                textAlign: s.textAlign,
                fontStyle: s.fontStyle,
                fontWeight: s.fontWeight
              };
            };
            const buttons = [...document.querySelectorAll('.fp-hero__buttons .fp-btn')].map(el => ({ text:el.textContent.trim(), transform:getComputedStyle(el).textTransform }));
            const navLinks = [...document.querySelectorAll('.fp-nav__links a')].map(el => ({ text:el.textContent.trim(), transform:getComputedStyle(el).textTransform }));
            const rail = document.querySelector('[data-fp-rail]');
            const prev = document.querySelector('[data-fp-prev]');
            const next = document.querySelector('[data-fp-next]');
            const railStyle = rail ? getComputedStyle(rail) : null;
            return {
              statusText: document.body.innerText,
              buttons,
              navLinks,
              titles: {
                collection: inspect('.fp-collection__title h2'),
                story: inspect('.fp-story__title'),
                films: inspect('.fp-films h2'),
                atHome: inspect('.fp-at-home__title'),
                newsletter: inspect('.fp-newsletter h2')
              },
              rail: rail ? { scrollLeft:rail.scrollLeft, scrollWidth:rail.scrollWidth, clientWidth:rail.clientWidth, paddingLeft:parseFloat(railStyle.paddingLeft) || 0 } : null,
              prevDisabled: prev?.disabled ?? null,
              nextDisabled: next?.disabled ?? null,
              overflow: document.documentElement.scrollWidth > window.innerWidth + 2
            };
          });

          const rail = page.locator('[data-fp-rail]');
          if (await rail.count()) {
            await rail.evaluate(el => el.scrollTo({ left: Math.min(500, Math.max(0,el.scrollWidth-el.clientWidth)), behavior:'instant' }));
            await page.waitForTimeout(250);
          }
          const afterScroll = await page.evaluate(() => ({
            scrollLeft: document.querySelector('[data-fp-rail]')?.scrollLeft ?? null,
            prevDisabled: document.querySelector('[data-fp-prev]')?.disabled ?? null
          }));

          const isSerif = (item) => Boolean(item && /Georgia|Times New Roman|serif/i.test(item.fontFamily));
          const navGiGi = initial.navLinks.some(item => item.text === 'GiGi' && item.transform === 'none');
          const meetGiGi = initial.buttons.some(item => item.text === 'Meet GiGi' && item.transform === 'none');
          const noBadGiGiCasing = !/(^|\s|[^A-Za-z])(?:Gigi|gigi|GIGI)(?=\s|[^A-Za-z]|$)/m.test(initial.statusText.replace(/GiGi/g,''));
          const sectionCopy = initial.titles.collection?.text === 'the prints'
            && initial.titles.story?.text === 'meet GiGi'
            && initial.titles.atHome?.text === 'friday at home'
            && initial.titles.newsletter?.text === 'postcards from GiGi'
            && (!initial.titles.films || initial.titles.films.text === 'the art of arrival');
          const sectionFonts = ['collection','story','atHome','newsletter'].every(key => isSerif(initial.titles[key]))
            && (!initial.titles.films || isSerif(initial.titles.films));
          const sectionAlignment = initial.titles.collection?.textAlign === 'center'
            && initial.titles.story?.textAlign === 'start'
            && initial.titles.atHome?.textAlign === 'start'
            && initial.titles.newsletter?.textAlign === 'start';
          const titleCasingPreserved = ['collection','story','atHome','newsletter'].every(key => initial.titles[key]?.textTransform === 'none');
          const prevCorrectAtStart = initial.rail ? initial.prevDisabled === true : false;
          const prevEnablesAfterScroll = initial.rail && initial.rail.scrollWidth > initial.rail.clientWidth
            ? afterScroll.scrollLeft > initial.rail.paddingLeft + 3 && afterScroll.prevDisabled === false
            : true;
          const atHomeScale = initial.titles.atHome ? parseFloat(initial.titles.atHome.fontSize) <= 52.5 : false;
          const pass = response?.status() < 400 && navGiGi && meetGiGi && noBadGiGiCasing && sectionCopy && sectionFonts && sectionAlignment && titleCasingPreserved && prevCorrectAtStart && prevEnablesAfterScroll && atHomeScale && !initial.overflow;

          const result = { pass, httpStatus:response?.status() ?? null, navGiGi, meetGiGi, noBadGiGiCasing, sectionCopy, sectionFonts, sectionAlignment, titleCasingPreserved, prevCorrectAtStart, prevEnablesAfterScroll, atHomeScale, initial:{...initial,statusText:undefined}, afterScroll };
          fs.writeFileSync('home-fixes-result.json', JSON.stringify(result,null,2));
          await page.screenshot({ path:'home-fixes.png', fullPage:true });
          await browser.close();
          console.log(JSON.stringify(result,null,2));
          if (!pass) process.exitCode = 1;
          EOF
          node home-fixes-qa.mjs
      - name: Upload QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: friday-home-design-system
          path: |
            home-fixes.png
            home-fixes-result.json
          retention-days: 3
      - name: Record QA result
        if: always()
        run: |
          python - <<'PY'
          import json, os
          try:
              result=json.load(open('home-fixes-result.json'))
          except Exception as e:
              result={'pass':False,'error':str(e)}
          result['run_id']=int(os.environ['GITHUB_RUN_ID'])
          result['source_sha']=os.environ['GITHUB_SHA']
          json.dump(result,open('.home-fixes-status.json','w'),indent=2)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .home-fixes-status.json
          git commit -m 'Record homepage design QA [skip ci]' || exit 0
          git pull --rebase origin friday-build
          git push origin HEAD:friday-build
