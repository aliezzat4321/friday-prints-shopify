name: Homepage Fixes QA

on:
  push:
    branches: [friday-build]
    paths-ignore:
      - '.home-fixes-status.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  home-fixes-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: friday-build
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright package
        run: npm install playwright@1.55.0 >/dev/null 2>&1
      - name: Wait for Shopify sync
        run: sleep 20
      - name: Audit homepage fixes
        env:
          STORE_URL: https://il1m2791s4dmofov-108268650782.shopifypreview.com
        run: |
          cat > home-fixes-qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const executablePath = fs.existsSync('/usr/bin/google-chrome') ? '/usr/bin/google-chrome' : undefined;
          const browser = await chromium.launch({ headless:true, executablePath });
          const page = await browser.newPage({ viewport:{ width:1440, height:1000 } });
          await page.goto(`${process.env.STORE_URL}/?home_fixes=${Date.now()}`, { waitUntil:'domcontentloaded', timeout:60000 });
          await page.waitForLoadState('networkidle', { timeout:20000 }).catch(() => {});
          await page.waitForTimeout(1200);

          const initial = await page.evaluate(() => {
            const buttons = [...document.querySelectorAll('.fp-hero__buttons .fp-btn')].map(el => ({ text:el.textContent.trim(), transform:getComputedStyle(el).textTransform }));
            const rail = document.querySelector('[data-fp-rail]');
            const prev = document.querySelector('[data-fp-prev]');
            const next = document.querySelector('[data-fp-next]');
            const atHome = document.querySelector('[id^="FridayAtHome-"]');
            const title = atHome?.querySelector('.fp-at-home__title');
            return {
              buttons,
              rail: rail ? { scrollLeft:rail.scrollLeft, scrollWidth:rail.scrollWidth, clientWidth:rail.clientWidth } : null,
              prevDisabled: prev?.disabled ?? null,
              nextDisabled: next?.disabled ?? null,
              atHomeTitleFont: title ? getComputedStyle(title).fontSize : null,
              atHomeHasCompatCss: atHome?.querySelector('style')?.textContent.includes('min(var(--fp-at-home-heading-desktop),52px)') ?? false
            };
          });

          const rail = page.locator('[data-fp-rail]');
          if (await rail.count()) {
            await rail.evaluate(el => el.scrollTo({ left: Math.min(500, el.scrollWidth - el.clientWidth), behavior:'instant' }));
            await page.waitForTimeout(250);
          }
          const afterScroll = await page.evaluate(() => ({
            scrollLeft: document.querySelector('[data-fp-rail]')?.scrollLeft ?? null,
            prevDisabled: document.querySelector('[data-fp-prev]')?.disabled ?? null
          }));

          const meetGiGi = initial.buttons.some(b => b.text === 'Meet GiGi' && b.transform === 'none');
          const prevCorrectAtStart = initial.rail ? initial.prevDisabled === true : false;
          const prevEnablesAfterScroll = initial.rail && initial.rail.scrollWidth > initial.rail.clientWidth ? afterScroll.scrollLeft > 3 && afterScroll.prevDisabled === false : true;
          const atHomeCompat = initial.atHomeHasCompatCss && parseFloat(initial.atHomeTitleFont || '999') <= 52.1;
          const pass = meetGiGi && prevCorrectAtStart && prevEnablesAfterScroll && atHomeCompat;

          const result = { pass, meetGiGi, prevCorrectAtStart, prevEnablesAfterScroll, atHomeCompat, initial, afterScroll };
          fs.writeFileSync('home-fixes-result.json', JSON.stringify(result,null,2));
          await page.screenshot({ path:'home-fixes.png', fullPage:true });
          await browser.close();
          console.log(JSON.stringify(result,null,2));
          if (!pass) process.exitCode = 1;
          EOF
          node home-fixes-qa.mjs
      - name: Upload QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: friday-home-fixes
          path: |
            home-fixes.png
            home-fixes-result.json
          retention-days: 2
      - name: Record QA result
        if: always()
        run: |
          python - <<'PY'
          import json, os
          try:
              result=json.load(open('home-fixes-result.json'))
          except Exception as e:
              result={'pass':False,'error':str(e)}
          result['run_id']=int(os.environ['GITHUB_RUN_ID'])
          result['source_sha']=os.environ['GITHUB_SHA']
          json.dump(result,open('.home-fixes-status.json','w'),indent=2)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .home-fixes-status.json
          git commit -m 'Record homepage fixes QA [skip ci]' || exit 0
          git pull --rebase origin friday-build
          git push origin HEAD:friday-build
