name: World of GiGi V3 QA

on:
  push:
    branches: [friday-build]
    paths-ignore:
      - '.world-gigi-v3-qa.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: friday-build
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install playwright@1.55.0 >/dev/null 2>&1
      - run: sleep 24
      - name: Visual check
        env:
          STORE_URL: https://tm06px8w771tm2dd-108268650782.shopifypreview.com
        run: |
          cat > qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          fs.mkdirSync('world-gigi-v3-qa',{recursive:true});
          const browser=await chromium.launch({headless:true,executablePath:fs.existsSync('/usr/bin/google-chrome')?'/usr/bin/google-chrome':undefined});
          const views=[['desktop',1440,1000],['laptop',1280,800],['tablet',820,1180],['mobile',390,844],['small-mobile',320,700]];
          const out=[]; let pass=true;
          for(const [name,w,h] of views){
            const ctx=await browser.newContext({viewport:{width:w,height:h},deviceScaleFactor:1});
            const page=await ctx.newPage();
            await page.goto(`${process.env.STORE_URL}/pages/about?v3qa=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForLoadState('networkidle',{timeout:20000}).catch(()=>{});
            await page.waitForTimeout(1200);
            const m=await page.evaluate(()=>{
              const gallery=document.querySelector('.fp-world__gallery');
              const cards=[...document.querySelectorAll('.fp-world-card')];
              const hero=document.querySelector('.fp-page-hero');
              const gigi=document.querySelector('.fp-world__gigi');
              const rect=e=>{const r=e?.getBoundingClientRect();return r?{x:+r.x.toFixed(1),y:+r.y.toFixed(1),w:+r.width.toFixed(1),h:+r.height.toFixed(1)}:null};
              const gs=gallery?getComputedStyle(gallery):null;
              return {
                cssLoaded:[...document.styleSheets].some(s=>(s.href||'').includes('friday-world-v3.css')),
                display:gs?.display,overflowX:gs?.overflowX,
                cards:cards.map(rect),hero:rect(hero),gigi:rect(gigi),
                broken:[...document.images].filter(i=>!i.complete||!i.naturalWidth).length,
                pageOverflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2,
                title:document.querySelector('.fp-page-title')?.textContent?.trim()
              };
            });
            let composition=false;
            if(w>1000){ composition=m.display==='grid' && m.cards[0]?.w>m.cards[1]?.w && m.cards[1]?.y>m.cards[0]?.y && m.cards[2]?.y>m.cards[0]?.y; }
            else if(w>=750){ composition=m.display==='grid' && m.cards[0]?.w>m.cards[1]?.w; }
            else { composition=m.display==='flex' && m.cards[0]?.w>w*.65 && m.cards[0]?.w<w*.85; }
            const ok=m.cssLoaded && composition && m.broken===0 && !m.pageOverflow && m.title==='world of GiGi';
            if(!ok) pass=false;
            out.push({name,w,h,ok,composition,m});
            await page.screenshot({path:`world-gigi-v3-qa/${name}-full.png`,fullPage:true});
            for(const [label,sel] of [['hero','.fp-page-hero'],['story','.fp-world__story'],['gallery','.fp-world__gallery']]){
              const loc=page.locator(sel); if(await loc.count()) await loc.screenshot({path:`world-gigi-v3-qa/${name}-${label}.png`});
            }
            await ctx.close();
          }
          await browser.close();
          fs.writeFileSync('.world-gigi-v3-qa.json',JSON.stringify({pass,run_id:Number(process.env.GITHUB_RUN_ID),source_sha:process.env.GITHUB_SHA,out},null,2));
          if(!pass) process.exitCode=1;
          EOF
          node qa.mjs
      - name: Record result
        if: always()
        run: |
          test -f .world-gigi-v3-qa.json || echo '{"pass":false,"error":"no result"}' > .world-gigi-v3-qa.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .world-gigi-v3-qa.json
          git commit -m 'Record World of GiGi v3 QA [skip ci]' || exit 0
          git pull --rebase origin friday-build
          git push origin HEAD:friday-build
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-gigi-v3-qa
          path: world-gigi-v3-qa/
          retention-days: 2
