name: Friday Prints Final Storefront QA

on:
  push:
    branches:
      - friday-build
  workflow_dispatch:

concurrency:
  group: friday-final-storefront-qa
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  final-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Allow Shopify preview sync
        run: sleep 50
      - name: Audit launch routes
        env:
          STORE_URL: https://ygv356jws4gmk7hs-108268650782.shopifypreview.com
        run: |
          cat > final-qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          fs.mkdirSync('final-storefront-qa', { recursive:true });

          const routes = [
            ['home','/','.fp-hero'],
            ['shop','/collections/all','.fp-shop'],
            ['world','/pages/about','.fp-content-page--about'],
            ['guide','/pages/info','.fp-content-page--info'],
            ['faq','/pages/faq','.fp-content-page--faq'],
            ['search','/search','.fp-search-page'],
            ['cart','/cart','.cart-page'],
            ['shipping','/policies/shipping-policy','.shopify-policy__container'],
            ['privacy','/policies/privacy-policy','.shopify-policy__container'],
            ['404','/gigi-definitely-is-not-here-404','.fp-404']
          ];
          const viewports = [['desktop',1440,900],['mobile',390,844]];
          const browser = await chromium.launch({headless:true});
          const report=[];
          let failed=false;

          for (const [device,width,height] of viewports) {
            const context = await browser.newContext({viewport:{width,height},deviceScaleFactor:1});
            for (const [name,path,selector] of routes) {
              const page = await context.newPage();
              const consoleErrors=[];
              page.on('console',m=>{ if(m.type()==='error') consoleErrors.push(m.text()); });
              let response=null;
              let navigationError=null;
              try {
                response=await page.goto(new URL(`${path}${path.includes('?')?'&':'?'}finalqa=${Date.now()}`,process.env.STORE_URL).href,{waitUntil:'domcontentloaded',timeout:60000});
                await page.waitForLoadState('networkidle',{timeout:25000}).catch(()=>{});
                await page.evaluate(async()=>{ if(document.fonts?.ready) await document.fonts.ready; });
                await page.waitForTimeout(700);
              } catch (error) { navigationError=String(error); }

              let searchOverlay=null;
              if(name==='search' && !navigationError){
                const trigger=page.locator('.fp-search').first();
                if(await trigger.count()){
                  await trigger.click();
                  await page.waitForTimeout(350);
                  const dialog=page.locator('#search-modal dialog[open]');
                  const input=page.locator('#search-modal input[name="q"]');
                  const opened=await dialog.count()>0;
                  const heading=opened ? await dialog.locator('.fp-search-overlay__heading').textContent().catch(()=>null) : null;
                  if(opened){
                    await input.fill('before the dress');
                    await page.waitForTimeout(900);
                  }
                  const resultCards=opened ? await dialog.locator('.predictive-search-results__card--product').count() : 0;
                  const viewAllPresent=opened ? await dialog.locator('.predictive-search__search-button').isVisible().catch(()=>false) : false;
                  const layout=opened ? await dialog.evaluate((node)=>{
                    const box=node.getBoundingClientRect();
                    const masthead=node.querySelector('.fp-search-overlay__masthead')?.getBoundingClientRect();
                    const searchField=node.querySelector('.predictive-search-form__header')?.getBoundingClientRect();
                    const reset=node.querySelector('.predictive-search__reset-button');
                    const resetBox=reset?.getBoundingClientRect();
                    return {
                      fitsViewport:box.left>=-1&&box.right<=window.innerWidth+1&&box.top>=-1&&box.bottom<=window.innerHeight+1,
                      fieldBelowHeading:!!masthead&&!!searchField&&searchField.top>=masthead.bottom-2,
                      resetFits:!!reset&&!!resetBox&&!!searchField&&reset.scrollWidth<=reset.clientWidth+1&&resetBox.left>=searchField.left-1&&resetBox.right<=searchField.right+1&&resetBox.top>=searchField.top-1&&resetBox.bottom<=searchField.bottom+1
                    };
                  }) : null;
                  searchOverlay={opened,heading:heading?.trim()||null,resultCards,viewAllPresent,layout};
                  await page.screenshot({path:`final-storefront-qa/${device}-search-overlay.png`,fullPage:false}).catch(()=>{});
                  if(opened) await dialog.locator('.predictive-search__close-modal-button').click().catch(()=>{});
                } else searchOverlay={opened:false,heading:null,resultCards:0,viewAllPresent:false};
              }

              const metrics=await page.evaluate((expectedSelector)=>{
                const broken=[...document.images].filter(i=>i.complete&&i.naturalWidth===0).map(i=>({src:i.currentSrc||i.src,alt:i.alt}));
                const text=document.body.innerText;
                const nav=[...document.querySelectorAll('.fp-nav__links a')].map(a=>({text:a.textContent.trim(),transform:getComputedStyle(a).textTransform}));
                const mobileNav=[...document.querySelectorAll('.fp-mobile-menu a')].map(a=>({text:a.textContent.trim(),transform:getComputedStyle(a).textTransform}));
                const pageTitle=document.querySelector('.fp-page-title');
                const newsletter=document.querySelector('.fp-newsletter h2');
                const heroWorld=document.querySelector('.fp-hero__world');
                const ghost=document.querySelector('.fp-site-header .fp-gigi-editor-placeholder');
                const homeTitles=[
                  document.querySelector('.fp-collection__title h2'),
                  document.querySelector('.fp-story__title'),
                  document.querySelector('.fp-films h2'),
                  document.querySelector('.fp-at-home__title'),
                  newsletter
                ].filter(Boolean).map(el=>({text:el.textContent.trim(),font:getComputedStyle(el).fontFamily,size:parseFloat(getComputedStyle(el).fontSize),align:getComputedStyle(el).textAlign,transform:getComputedStyle(el).textTransform,style:getComputedStyle(el).fontStyle}));
                return {
                  expectedPresent:!!document.querySelector(expectedSelector),
                  headerPresent:!!document.querySelector('.fp-site-header'),
                  footerPresent:!!document.querySelector('.fp-footer'),
                  scrollWidth:Math.max(document.documentElement.scrollWidth,document.body.scrollWidth),
                  clientWidth:document.documentElement.clientWidth,
                  brokenImages:broken,
                  stockFooterLeak:/Skincare|Makeup|skincare tips/i.test(text),
                  badGiGiCasing:/(^|\s|[^A-Za-z])(?:Gigi|gigi|GIGI)(?=\s|[^A-Za-z]|$)/m.test(text.replace(/GiGi/g,'')),
                  nav,
                  mobileNav,
                  pageTitle:pageTitle?{text:pageTitle.textContent.trim(),transform:getComputedStyle(pageTitle).textTransform,font:getComputedStyle(pageTitle).fontFamily}:null,
                  newsletter:newsletter?newsletter.textContent.trim():null,
                  heroWorld:heroWorld?{text:heroWorld.textContent.trim(),transform:getComputedStyle(heroWorld).textTransform}:null,
                  editorGhostVisible:!!ghost && getComputedStyle(ghost).display!=='none',
                  homeTitles,
                  title:document.title
                };
              },selector).catch(()=>({expectedPresent:false,headerPresent:false,footerPresent:false,brokenImages:[],stockFooterLeak:false,badGiGiCasing:false,scrollWidth:0,clientWidth:0,title:'',nav:[],mobileNav:[],homeTitles:[]}));

              const errors=[];
              const status=response?.status()??null;
              const expected404=name==='404';
              const desktopWorld=metrics.nav.find(x=>x.text==='world of GiGi'&&x.transform==='none');
              const mobileWorld=metrics.mobileNav.find(x=>x.text==='world of GiGi'&&x.transform==='none');
              if(navigationError) errors.push('NAVIGATION_ERROR');
              if(expected404){ if(status!==404 && status!==200) errors.push(`UNEXPECTED_404_STATUS:${status}`); }
              else if(status && status>=400) errors.push(`HTTP_${status}`);
              if(!metrics.expectedPresent) errors.push('EXPECTED_FRIDAY_SURFACE_MISSING');
              if(!metrics.headerPresent) errors.push('FRIDAY_HEADER_MISSING');
              if(!metrics.footerPresent) errors.push('FRIDAY_FOOTER_MISSING');
              if(metrics.scrollWidth>metrics.clientWidth+2) errors.push(`HORIZONTAL_OVERFLOW:${metrics.scrollWidth}-${metrics.clientWidth}`);
              if(metrics.brokenImages.length) errors.push(`BROKEN_IMAGES:${metrics.brokenImages.length}`);
              if(metrics.stockFooterLeak) errors.push('STOCK_FOOTER_CONTENT_LEAK');
              if(metrics.badGiGiCasing && name!=='404') errors.push('BAD_GIGI_CASING');
              if(metrics.editorGhostVisible) errors.push('EDITOR_GIGI_PLACEHOLDER_VISIBLE');
              if(device==='desktop' && !desktopWorld) errors.push('DESKTOP_WORLD_OF_GIGI_NAV_MISSING');
              if(device==='mobile' && !mobileWorld) errors.push('MOBILE_WORLD_OF_GIGI_NAV_MISSING');
              if(metrics.pageTitle && metrics.pageTitle.transform!=='none') errors.push('PAGE_TITLE_FORCED_CASING');
              if(metrics.pageTitle && !/Georgia|Times New Roman|serif/i.test(metrics.pageTitle.font)) errors.push('PAGE_TITLE_WRONG_FONT');
              if(name==='world' && metrics.pageTitle?.text!=='world of GiGi') errors.push('WORLD_TITLE_CASING');
              if(name==='home'){
                if(metrics.newsletter!=='postcards from GiGi') errors.push('NEWSLETTER_TITLE_CONTRACT');
                if(metrics.heroWorld?.text!=='FROM THE WORLD OF GiGi'||metrics.heroWorld?.transform!=='none') errors.push('HERO_GIGI_CASING');
                if(metrics.homeTitles.length<4) errors.push('HOME_TITLES_MISSING');
                for(const heading of metrics.homeTitles){
                  if(!/Georgia|Times New Roman|serif/i.test(heading.font)||heading.style!=='normal'||heading.transform!=='none') errors.push(`HOME_TITLE_STYLE:${heading.text}`);
                  const expectedSize=device==='desktop'?52:38;
                  if(Math.abs(heading.size-expectedSize)>.7) errors.push(`HOME_TITLE_SIZE:${heading.text}:${heading.size}`);
                }
              }
              if(name==='search'){
                if(!searchOverlay?.opened) errors.push('SEARCH_OVERLAY_DID_NOT_OPEN');
                if(searchOverlay?.heading!=='search prints') errors.push('SEARCH_OVERLAY_HEADING_MISSING');
                if((searchOverlay?.resultCards??0)<1) errors.push('PREDICTIVE_PRODUCT_RESULTS_MISSING');
                if(!searchOverlay?.viewAllPresent) errors.push('VIEW_ALL_RESULTS_MISSING');
                if(!searchOverlay?.layout?.fitsViewport) errors.push('SEARCH_OVERLAY_OUTSIDE_VIEWPORT');
                if(device==='mobile'&&!searchOverlay?.layout?.fieldBelowHeading) errors.push('MOBILE_SEARCH_OVERLAY_NOT_STACKED');
                if(device==='mobile'&&!searchOverlay?.layout?.resetFits) errors.push('MOBILE_SEARCH_CLEAR_CLIPPED');
              }

              await page.screenshot({path:`final-storefront-qa/${device}-${name}-top.png`,fullPage:false}).catch(()=>{});
              await page.evaluate(()=>window.scrollTo(0,document.body.scrollHeight)).catch(()=>{});
              await page.waitForTimeout(120);
              await page.screenshot({path:`final-storefront-qa/${device}-${name}-bottom.png`,fullPage:false}).catch(()=>{});

              if(errors.length) failed=true;
              report.push({device,name,path,status,url:page.url(),metrics,searchOverlay,consoleErrors,errors,navigationError});
              await page.close();
            }
            await context.close();
          }

          await browser.close();
          fs.writeFileSync('final-storefront-qa/report.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report.map(({device,name,status,errors})=>({device,name,status,errors})),null,2));
          if(failed) process.exitCode=1;
          EOF
          node final-qa.mjs
      - name: Upload final storefront QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: friday-prints-final-storefront-qa
          path: final-storefront-qa/
          retention-days: 7
