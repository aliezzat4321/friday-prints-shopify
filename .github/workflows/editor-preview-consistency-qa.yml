name: Editor Preview Consistency QA

on:
  push:
    branches: [friday-build]
    paths-ignore:
      - '.editor-preview-consistency-status.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: friday-build
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: npm install playwright@1.55.0 >/dev/null 2>&1
      - name: Wait for Shopify sync
        run: sleep 18
      - name: Audit responsive transitions
        env:
          STORE_URL: https://il1m2791s4dmofov-108268650782.shopifypreview.com
        run: |
          cat > qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          fs.mkdirSync('editor-preview-consistency',{recursive:true});
          const executablePath=fs.existsSync('/usr/bin/google-chrome')?'/usr/bin/google-chrome':undefined;
          const browser=await chromium.launch({headless:true,executablePath});
          const widths=[820,900,960,1024,1080,1120,1280,1440];
          const report=[];
          for(const width of widths){
            const ctx=await browser.newContext({viewport:{width,height:900},deviceScaleFactor:1});
            const page=await ctx.newPage();
            await page.goto(`${process.env.STORE_URL}/?ctx=${width}-${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForLoadState('networkidle',{timeout:20000}).catch(()=>{});
            await page.waitForTimeout(700);
            const m=await page.evaluate(()=>{
              const hero=document.querySelector('.fp-hero');
              const grid=document.querySelector('.fp-hero__grid');
              const title=document.querySelector('.fp-hero h1');
              const art=document.querySelector('.fp-hero__scene img');
              const prints=document.querySelector('.fp-collection');
              const r=e=>{if(!e)return null;const b=e.getBoundingClientRect();return {w:+b.width.toFixed(1),h:+b.height.toFixed(1),y:+(b.top+scrollY).toFixed(1)}};
              return {hero:r(hero),grid:r(grid),titleFont:title?parseFloat(getComputedStyle(title).fontSize):null,art:r(art),prints:r(prints),overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2,consistencyLoaded:[...document.styleSheets].some(s=>(s.href||'').includes('friday-responsive-consistency.css'))};
            });
            await page.screenshot({path:`editor-preview-consistency/${width}.png`,fullPage:false});
            report.push({width,...m});
            await ctx.close();
          }
          await browser.close();
          const jumps=[];
          for(let i=1;i<report.length;i++){
            jumps.push({from:report[i-1].width,to:report[i].width,heroDelta:+(report[i].hero.h-report[i-1].hero.h).toFixed(1),titleDelta:+(report[i].titleFont-report[i-1].titleFont).toFixed(1)});
          }
          const pass=report.every(r=>r.consistencyLoaded&&!r.overflow)&&jumps.every(j=>Math.abs(j.heroDelta)<80&&Math.abs(j.titleDelta)<12);
          const out={pass,report,jumps};
          fs.writeFileSync('editor-preview-consistency/report.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify(out,null,2));
          if(!pass)process.exitCode=1;
          EOF
          node qa.mjs
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-preview-consistency
          path: editor-preview-consistency/
          retention-days: 2
      - name: Record result
        if: always()
        run: |
          python - <<'PY'
          import json,os
          try: data=json.load(open('editor-preview-consistency/report.json'))
          except Exception as e: data={'pass':False,'error':str(e)}
          data['run_id']=int(os.environ['GITHUB_RUN_ID']);data['source_sha']=os.environ['GITHUB_SHA']
          json.dump(data,open('.editor-preview-consistency-status.json','w'),indent=2)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .editor-preview-consistency-status.json
          git commit -m 'Record editor preview consistency QA [skip ci]' || exit 0
          git pull --rebase origin friday-build
          git push origin HEAD:friday-build
