name: Friday Prints Mobile Menu QA

on:
  push:
    branches:
      - friday-build
    paths:
      - 'sections/friday-header.liquid'
      - '.github/workflows/mobile-menu-qa.yml'
  workflow_dispatch:

concurrency:
  group: friday-mobile-menu-qa
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mobile-menu-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Allow Shopify preview sync
        run: sleep 75
      - name: Open and audit mobile menu
        env:
          STORE_URL: https://il1m2791s4dmofov-108268650782.shopifypreview.com
        run: |
          cat > mobile-menu-qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          fs.mkdirSync('mobile-menu-qa', { recursive:true });
          const browser = await chromium.launch({headless:true});
          const results=[];
          let failed=false;

          for (const [name,width,height] of [['mobile-390',390,844],['mobile-320',320,700],['tablet-820',820,1180]]) {
            const context = await browser.newContext({viewport:{width,height},deviceScaleFactor:1});
            const page = await context.newPage();
            await page.goto(process.env.STORE_URL,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForLoadState('networkidle',{timeout:25000}).catch(()=>{});
            await page.waitForTimeout(1000);

            const summary = page.locator('.fp-menu > summary').first();
            if (!(await summary.count())) throw new Error('Menu summary missing');
            const closedSummaryRect = await summary.boundingBox();
            await summary.click();
            await page.waitForTimeout(650);

            const metrics = await page.evaluate(() => {
              const visible = (el) => {
                if (!el) return false;
                const s=getComputedStyle(el);
                const r=el.getBoundingClientRect();
                return s.display !== 'none' && s.visibility !== 'hidden' && Number(s.opacity || 1) > 0.01 && r.width > 0 && r.height > 0;
              };
              const menu=document.querySelector('.fp-mobile-menu');
              const details=document.querySelector('.fp-menu');
              const rect=menu?.getBoundingClientRect();
              const cs=menu ? getComputedStyle(menu) : null;
              const summary=document.querySelector('.fp-menu > summary');
              const sr=summary?.getBoundingClientRect();
              const firstLink=menu?.querySelector('.fp-mobile-menu__links > a');
              const fr=firstLink?.getBoundingClientRect();
              const footer=document.querySelector('.fp-footer');
              const footerBrand=document.querySelector('.fp-footer__brand');
              const footerSocial=document.querySelector('.fp-footer__social');
              const main=document.querySelector('#MainContent');
              const logos=[...document.querySelectorAll('.fp-logo')];
              const visibleLogos=logos.filter(visible);
              return {
                open:!!details?.open,
                rect:rect ? {x:rect.x,y:rect.y,width:rect.width,height:rect.height} : null,
                position:cs?.position,
                visibility:cs?.visibility,
                opacity:cs?.opacity,
                display:cs?.display,
                background:cs?.backgroundColor,
                bodyOverflow:getComputedStyle(document.body).overflow,
                htmlOverflow:getComputedStyle(document.documentElement).overflow,
                bodyHasOpenClass:document.body.classList.contains('fp-mobile-menu-open'),
                rootHasOpenClass:!!document.querySelector('[id^="FridayHeader-"]')?.classList.contains('fp-menu-is-open'),
                linkCount:menu?.querySelectorAll('.fp-mobile-menu__links > a').length || 0,
                bottomCount:menu?.querySelectorAll('.fp-mobile-menu__bottom').length || 0,
                bottomText:menu?.querySelector('.fp-mobile-menu__bottom')?.textContent?.trim() || '',
                summaryRect:sr ? {x:sr.x,y:sr.y,width:sr.width,height:sr.height} : null,
                firstLinkRect:fr ? {x:fr.x,y:fr.y,width:fr.width,height:fr.height} : null,
                visibleLogoCount:visibleLogos.length,
                footerDisplay:footer ? getComputedStyle(footer).display : 'missing',
                footerBrandVisible:visible(footerBrand),
                footerSocialVisible:visible(footerSocial),
                mainDisplay:main ? getComputedStyle(main).display : 'missing'
              };
            });

            const errors=[];
            if (!metrics.open) errors.push('MENU_NOT_OPEN');
            if (!metrics.rect) errors.push('MENU_MISSING');
            if (metrics.position !== 'fixed') errors.push(`NOT_FIXED:${metrics.position}`);
            if (metrics.visibility !== 'visible') errors.push(`NOT_VISIBLE:${metrics.visibility}`);
            if (Number(metrics.opacity) < .95) errors.push(`LOW_OPACITY:${metrics.opacity}`);
            if (metrics.rect && Math.abs(metrics.rect.x) > 2) errors.push(`X_OFFSET:${metrics.rect.x}`);
            if (metrics.rect && Math.abs(metrics.rect.y) > 2) errors.push(`Y_OFFSET:${metrics.rect.y}`);
            if (metrics.rect && metrics.rect.width < width - 2) errors.push(`NOT_FULL_WIDTH:${metrics.rect.width}/${width}`);
            if (metrics.rect && metrics.rect.height < height - 2) errors.push(`NOT_FULL_HEIGHT:${metrics.rect.height}/${height}`);
            if (metrics.linkCount < 5) errors.push(`TOO_FEW_LINKS:${metrics.linkCount}`);
            if (metrics.bottomCount !== 1) errors.push(`BOTTOM_COUNT:${metrics.bottomCount}`);
            if (metrics.visibleLogoCount !== 1) errors.push(`VISIBLE_LOGOS:${metrics.visibleLogoCount}`);
            if (metrics.footerBrandVisible) errors.push('FOOTER_BRAND_VISIBLE');
            if (metrics.footerSocialVisible) errors.push('FOOTER_SOCIAL_VISIBLE');
            if (metrics.footerDisplay !== 'none') errors.push(`FOOTER_NOT_HIDDEN:${metrics.footerDisplay}`);
            if (metrics.mainDisplay !== 'none') errors.push(`MAIN_NOT_HIDDEN:${metrics.mainDisplay}`);
            if (!metrics.bodyHasOpenClass || !metrics.rootHasOpenClass) errors.push('OPEN_CLASS_MISSING');
            if (metrics.bodyOverflow !== 'hidden' && metrics.htmlOverflow !== 'hidden') errors.push(`SCROLL_NOT_LOCKED:${metrics.bodyOverflow}/${metrics.htmlOverflow}`);
            if (closedSummaryRect && metrics.summaryRect && (Math.abs(closedSummaryRect.x-metrics.summaryRect.x)>1 || Math.abs(closedSummaryRect.y-metrics.summaryRect.y)>1)) errors.push(`CLOSE_MOVED:${closedSummaryRect.x},${closedSummaryRect.y}->${metrics.summaryRect.x},${metrics.summaryRect.y}`);
            if (errors.length) failed=true;

            await page.screenshot({path:`mobile-menu-qa/${name}-open.png`,fullPage:false});
            results.push({name,width,height,closedSummaryRect,metrics,errors});
            await context.close();
          }
          await browser.close();
          fs.writeFileSync('mobile-menu-qa/report.json',JSON.stringify(results,null,2));
          console.log(JSON.stringify(results,null,2));
          if (failed) process.exitCode=1;
          EOF
          node mobile-menu-qa.mjs
      - name: Upload mobile menu screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: friday-mobile-menu-open-state
          path: mobile-menu-qa/
          retention-days: 7
