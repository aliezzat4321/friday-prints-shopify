name: Friday Product Variant QA

on:
  push:
    branches: [friday-build]
    paths-ignore:
      - '.product-variant-status.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  product-variant-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: friday-build
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: npm install playwright@1.55.0 >/dev/null 2>&1
      - name: Allow Shopify preview sync
        run: sleep 35
      - name: Audit live A3 and A4 selection
        env:
          STORE_URL: https://bs166sge513c46zw-108268650782.shopifypreview.com
        run: |
          cat > product-variant-qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const executablePath = fs.existsSync('/usr/bin/google-chrome') ? '/usr/bin/google-chrome' : undefined;
          const browser = await chromium.launch({ headless: true, executablePath });
          const results = [];
          const singleSizeProducts = [
            { handle:'gigi-goes-to-the-jimjilbang', size:'A3', dimensions:'29.7 × 42 CM', total:100 },
            { handle:'the-offering-copy', size:'A3', dimensions:'29.7 × 42 CM', total:100 }
          ];

          for (const viewport of [{ name:'desktop', width:1280, height:900 }, { name:'mobile', width:390, height:844 }]) {
            const page = await browser.newPage({ viewport });
            await page.goto(`${process.env.STORE_URL}/products/cherry-hour?variantqa=${Date.now()}`, { waitUntil:'domcontentloaded', timeout:60000 });
            await page.waitForLoadState('networkidle', { timeout:20000 }).catch(() => {});
            await page.waitForTimeout(900);
            await page.locator('.fp-pdp').waitFor({ state:'visible', timeout:20000 });

            const inspectSize = async (sizeName) => {
              const input = page.locator(`[data-fp-variant][data-size="${sizeName}"]`).first();
              if (!(await input.count())) return { sizeName, missing:true };
              await input.check({ force:true });
              await page.waitForTimeout(180);
              return page.evaluate((expectedSize) => {
                const selectedInput = document.querySelector(`[data-fp-variant][data-size="${expectedSize}"]`);
                const number = Number(document.querySelector('[data-fp-next-edition]')?.textContent || 0);
                const total = Number(document.querySelector('[data-fp-edition-total]')?.textContent || 0);
                return {
                  sizeName: expectedSize,
                  checked: Boolean(selectedInput?.checked),
                  selectedVariantId: document.querySelector('.fp-pdp input[name="id"]')?.value || '',
                  expectedVariantId: selectedInput?.value || '',
                  displayedSize: document.querySelector('[data-fp-size]')?.textContent?.trim() || '',
                  displayedDimension: document.querySelector('[data-fp-dimension]')?.textContent?.trim() || '',
                  selectedLabel: document.querySelector('[data-fp-selected]')?.textContent?.trim() || '',
                  displayedPrice: document.querySelector('[data-fp-price]')?.textContent?.trim() || '',
                  number,
                  total,
                  available: selectedInput?.dataset.available === 'true',
                  addDisabled: Boolean(document.querySelector('.fp-pdp [ref="addToCartButton"]')?.disabled)
                };
              }, sizeName);
            };

            const optionCount = await page.locator('[data-fp-variant]').count();
            const initialPrice = await page.locator('[data-fp-price]').textContent().catch(() => '');
            const a3 = await inspectSize('A3');
            const a4 = await inspectSize('A4');
            const overflow = await page.evaluate(() => document.documentElement.scrollWidth > innerWidth + 2);
            const selectorVisible = await page.locator('.fp-pdp__variants').isVisible().catch(() => false);

            const valid = (item, total) => !item.missing
              && item.checked
              && item.selectedVariantId === item.expectedVariantId
              && item.displayedSize === item.sizeName
              && item.selectedLabel === item.sizeName
              && item.displayedPrice.length > 0
              && item.total === total
              && item.number >= 1
              && item.number <= total;

            const startingPriceValid = optionCount < 2 || /^from\s+/i.test((initialPrice || '').trim());
            const pass = optionCount >= 2 && selectorVisible && startingPriceValid && valid(a3, 100) && valid(a4, 150) && !overflow;
            await page.screenshot({ path:`product-variant-${viewport.name}.png`, fullPage:true });
            const singleSizeResults = [];
            for (const product of singleSizeProducts) {
              await page.goto(`${process.env.STORE_URL}/products/${product.handle}?singleqa=${Date.now()}`, { waitUntil:'domcontentloaded', timeout:60000 });
              await page.waitForLoadState('networkidle', { timeout:20000 }).catch(() => {});
              await page.waitForTimeout(600);
              await page.locator('.fp-pdp').waitFor({ state:'visible', timeout:20000 });
              const metrics = await page.evaluate(() => ({
                displayedSize: document.querySelector('[data-fp-size]')?.textContent?.trim() || '',
                displayedDimension: document.querySelector('[data-fp-dimension]')?.textContent?.trim() || '',
                number: Number(document.querySelector('[data-fp-next-edition]')?.textContent || 0),
                total: Number(document.querySelector('[data-fp-edition-total]')?.textContent || 0),
                selectorCount: document.querySelectorAll('[data-fp-variant]').length,
                selectorVisible: Boolean(document.querySelector('.fp-pdp__variants')?.getClientRects().length),
                editionVisible: Boolean(document.querySelector('[data-fp-edition-preview]')?.getClientRects().length),
                overflow: document.documentElement.scrollWidth > innerWidth + 2
              }));
              const productPass = metrics.displayedSize === product.size
                && metrics.displayedDimension === product.dimensions
                && metrics.total === product.total
                && metrics.number >= 1
                && metrics.number <= product.total
                && metrics.selectorCount === 0
                && !metrics.selectorVisible
                && metrics.editionVisible
                && !metrics.overflow;
              singleSizeResults.push({ product, pass:productPass, ...metrics });
              await page.screenshot({ path:`product-single-${product.handle}-${viewport.name}.png`, fullPage:true });
            }

            results.push({ viewport, pass:pass && singleSizeResults.every(item => item.pass), optionCount, selectorVisible, startingPriceValid, initialPrice, overflow, a3, a4, singleSizeResults });
            await page.close();
          }

          await browser.close();
          const pass = results.every(result => result.pass);
          fs.writeFileSync('product-variant-result.json', JSON.stringify({ pass, results }, null, 2));
          console.log(JSON.stringify({ pass, results }, null, 2));
          if (!pass) process.exitCode = 1;
          EOF
          status=0
          node product-variant-qa.mjs || status=$?
          if [ ! -f product-variant-result.json ]; then
            printf '%s\n' '{"pass":false,"error":"QA runner exited before producing product-variant-result.json. Check navigation/preview availability and Playwright logs."}' > product-variant-result.json
          fi
          exit "$status"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: friday-product-variant-qa
          path: |
            product-variant-desktop.png
            product-variant-mobile.png
            product-single-*.png
            product-variant-result.json
          retention-days: 3
      - name: Record QA result
        if: always()
        run: |
          python - <<'PY'
          import json, os
          try:
              result=json.load(open('product-variant-result.json'))
          except Exception as e:
              result={'pass':False,'error':f'Unable to read product-variant-result.json: {e}'}
          result['run_id']=int(os.environ['GITHUB_RUN_ID'])
          result['source_sha']=os.environ['GITHUB_SHA']
          json.dump(result,open('.product-variant-status.json','w'),indent=2)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .product-variant-status.json
          git commit -m 'Record product variant QA [skip ci]' || exit 0
          git pull --rebase origin friday-build
          git push origin HEAD:friday-build
