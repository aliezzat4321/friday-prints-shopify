name: PDP Mobile Center QA
on:
  push:
    branches: [friday-build]
    paths-ignore: ['.pdp-mobile-center-status.json']
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {ref: friday-build}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: npm install playwright@1.55.0 >/dev/null 2>&1
      - run: sleep 15
      - name: Measure mobile artwork gutters
        run: |
          cat > qa.mjs <<'EOF'
          import { chromium } from 'playwright'; import fs from 'node:fs';
          const browser=await chromium.launch({headless:true,executablePath:fs.existsSync('/usr/bin/google-chrome')?'/usr/bin/google-chrome':undefined});
          const out=[]; let pass=true;
          for (const [w,h] of [[390,844],[320,700]]) {
            const ctx=await browser.newContext({viewport:{width:w,height:h}}); const page=await ctx.newPage();
            await page.goto('https://tm06px8w771tm2dd-108268650782.shopifypreview.com/products/a-different-seoul-still-her-a3?centerqa='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForLoadState('networkidle',{timeout:20000}).catch(()=>{}); await page.waitForTimeout(600);
            const m=await page.evaluate(()=>{const e=document.querySelector('.fp-pdp__media:only-child'); const r=e?.getBoundingClientRect(); return r?{x:r.x,width:r.width,right:r.right,viewport:innerWidth,leftGutter:r.x,rightGutter:innerWidth-r.right}:null});
            const ok=!!m && Math.abs(m.leftGutter-m.rightGutter)<=2 && m.leftGutter>=18 && m.rightGutter>=18;
            if(!ok) pass=false; out.push({w,h,ok,m}); await ctx.close();
          }
          await browser.close(); fs.writeFileSync('.pdp-mobile-center-status.json',JSON.stringify({pass,out},null,2)); if(!pass) process.exitCode=1;
          EOF
          node qa.mjs
      - name: Record status
        if: always()
        run: |
          test -f .pdp-mobile-center-status.json || echo '{"pass":false,"error":"qa did not produce status"}' > .pdp-mobile-center-status.json
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .pdp-mobile-center-status.json; git commit -m 'Record PDP mobile center QA [skip ci]' || exit 0
          git pull --rebase origin friday-build; git push origin HEAD:friday-build
