name: Adjust Friday mobile menu position

on:
  push:
    branches: [friday-build]
    paths: ['.github/workflows/menu-position-adjust.yml']

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: friday-build
      - name: Push menu links down
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('sections/friday-header.liquid')
          text = path.read_text()
          old = '''      margin:0!important;\n      padding:18px 0 14px!important;'''
          new = '''      margin:48px 0 0!important;\n      padding:18px 0 14px!important;'''
          if old not in text:
              raise SystemExit('Target mobile menu spacing rule not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit spacing refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sections/friday-header.liquid
          git commit -m "Refine mobile menu vertical rhythm"
          git push origin HEAD:friday-build
