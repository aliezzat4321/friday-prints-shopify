name: PDP Rebuild QA

on:
  push:
    branches: [friday-build]
    paths-ignore:
      - '.pdp-rebuild-status.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: friday-build
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: npm install playwright@1.55.0 >/dev/null 2>&1
      - name: Wait for Shopify sync
        run: sleep 20
      - name: Validate rebuilt PDP
        env:
          STORE_URL: https://il1m2791s4dmofov-108268650782.shopifypreview.com
        run: |
          cat > qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          fs.mkdirSync('pdp-rebuild-qa',{recursive:true});
          const executablePath=fs.existsSync('/usr/bin/google-chrome')?'/usr/bin/google-chrome':undefined;
          const browser=await chromium.launch({headless:true,executablePath});
          const seed=await browser.newPage({viewport:{width:1280,height:800}});
          await seed.goto(`${process.env.STORE_URL}/collections/all?seed=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});
          await seed.waitForLoadState('networkidle',{timeout:20000}).catch(()=>{});
          const href=await seed.locator('.fp-shop-card').first().getAttribute('href');
          if(!href) throw new Error('No product found');
          const productUrl=new URL(href,process.env.STORE_URL).toString();
          await seed.close();
          const configs=[['desktop-1440',1440,1000],['laptop-1280',1280,800],['tablet-1024',1024,768],['tablet-820',820,1180],['mobile-390',390,844],['mobile-320',320,700]];
          const report=[]; let pass=true;
          for(const [name,width,height] of configs){
            const ctx=await browser.newContext({viewport:{width,height},deviceScaleFactor:1});
            const page=await ctx.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            await page.goto(`${productUrl}?rebuild=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForLoadState('networkidle',{timeout:20000}).catch(()=>{});
            await page.waitForTimeout(900);
            const m=await page.evaluate(()=>{
              const rect=s=>{const e=document.querySelector(s);if(!e)return null;const b=e.getBoundingClientRect();return {x:+b.x.toFixed(1),y:+b.y.toFixed(1),w:+b.width.toFixed(1),h:+b.height.toFixed(1),bottom:+b.bottom.toFixed(1)}};
              const add=document.querySelector('.fp-pdp__add');
              const media=document.querySelector('.fp-pdp__media');
              const top=document.querySelector('.fp-pdp__top');
              return {
                top:rect('.fp-pdp__top'),gallery:rect('.fp-pdp__gallery'),details:rect('.fp-pdp__details'),media:rect('.fp-pdp__media'),add:rect('.fp-pdp__add'),about:rect('.fp-pdp__about'),facts:rect('.fp-pdp__fact-band'),info:rect('.fp-pdp__info'),recommend:rect('.fp-pdp__recommend'),
                topDisplay:top?getComputedStyle(top).display:null,
                mediaBg:media?getComputedStyle(media).backgroundColor:null,
                addBg:add?getComputedStyle(add).backgroundColor:null,
                lightbox:!!document.querySelector('.fp-pdp__lightbox[data-fp-lightbox]'),
                lightboxTriggers:document.querySelectorAll('[data-fp-lightbox-trigger]').length,
                recs:document.querySelectorAll('.fp-pdp-rec').length,
                dynamicCheckout:document.querySelectorAll('.shopify-payment-button,[data-shopify="payment-button"]').length,
                price:document.querySelector('[data-fp-price]')?.textContent?.trim()||'',
                edition:document.querySelector('[data-fp-edition]')?.textContent?.trim()||'',
                overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2,
                brokenImages:[...document.images].filter(i=>i.complete&&i.naturalWidth===0).length
              };
            });
            let lightboxOpened=false;
            if(m.lightboxTriggers){
              await page.locator('[data-fp-lightbox-trigger]').first().click();
              await page.waitForTimeout(150);
              lightboxOpened=await page.locator('[data-fp-lightbox]').evaluate(d=>d.open);
              if(lightboxOpened) await page.locator('[data-fp-lightbox-close]').click();
            }
            let stickyVisible=null;
            if(width<750){
              const add=page.locator('.fp-pdp__add');
              await add.scrollIntoViewIfNeeded();
              await page.waitForTimeout(120);
              await page.evaluate(()=>window.scrollBy(0,250));
              await page.waitForTimeout(180);
              stickyVisible=await page.locator('[data-fp-mobile-buybar]').evaluate(e=>e.classList.contains('is-visible'));
            }
            const expectedStack=width<=899;
            const mobileCtaOkay=width>=750 || (m.add && m.add.y < height + 25);
            const ok=!m.overflow && m.brokenImages===0 && m.addBg==='rgb(23, 18, 15)' && m.mediaBg==='rgba(0, 0, 0, 0)' && m.lightbox && lightboxOpened && m.recs>=1 && m.dynamicCheckout===0 && (expectedStack ? m.topDisplay==='block' : m.topDisplay==='grid') && mobileCtaOkay && (width>=750 || stickyVisible===true) && errors.length===0;
            if(!ok)pass=false;
            report.push({name,width,height,ok,lightboxOpened,stickyVisible,errors,...m});
            await page.goto(`${productUrl}?commerce=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForLoadState('networkidle',{timeout:20000}).catch(()=>{});
            await page.waitForTimeout(500);
            await page.screenshot({path:`pdp-rebuild-qa/${name}-top.png`,fullPage:false});
            await page.screenshot({path:`pdp-rebuild-qa/${name}-full.png`,fullPage:true});
            await ctx.close();
          }
          // Dedicated commerce check on desktop.
          const ctx=await browser.newContext({viewport:{width:1280,height:800},deviceScaleFactor:1});
          const page=await ctx.newPage();
          await page.goto(`${productUrl}?commercefinal=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForLoadState('networkidle',{timeout:20000}).catch(()=>{});
          await page.waitForTimeout(700);
          let commerce=false;
          const add=page.locator('.fp-pdp__add');
          if(await add.isEnabled().catch(()=>false)){
            await add.click();
            await page.waitForTimeout(1200);
            commerce=await page.evaluate(()=>{
              const drawer=document.querySelector('cart-drawer dialog,[data-cart-drawer] dialog,.cart-drawer dialog');
              const count=[...document.querySelectorAll('[data-cart-count],.cart-count,.cart-bubble')].some(e=>/\d/.test(e.textContent||''));
              return (!!drawer && (drawer.open || drawer.hasAttribute('open'))) || count;
            });
          }
          if(!commerce)pass=false;
          await ctx.close();
          await browser.close();
          const out={pass,productUrl,commerce,report};
          fs.writeFileSync('pdp-rebuild-qa/report.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify(out,null,2));
          if(!pass)process.exitCode=1;
          EOF
          node qa.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdp-rebuild-qa
          path: pdp-rebuild-qa/
          retention-days: 2
      - name: Record result
        if: always()
        run: |
          python - <<'PY'
          import json,os
          try:data=json.load(open('pdp-rebuild-qa/report.json'))
          except Exception as e:data={'pass':False,'error':str(e)}
          data['run_id']=int(os.environ['GITHUB_RUN_ID']);data['source_sha']=os.environ['GITHUB_SHA']
          json.dump(data,open('.pdp-rebuild-status.json','w'),indent=2)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .pdp-rebuild-status.json
          git commit -m 'Record PDP rebuild QA [skip ci]' || exit 0
          git pull --rebase origin friday-build
          git push origin HEAD:friday-build
