name: Friday Prints Menu Cleanup Trigger

on:
  push:
    branches:
      - friday-build
    paths:
      - '.github/scripts/menu_cleanup.trigger'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: friday-build
          fetch-depth: 0
      - name: Apply menu cleanup
        run: python .github/scripts/menu_cleanup.py
      - name: Commit cleanup
        run: |
          git config user.name "Friday Prints Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add sections/friday-header.liquid .github/workflows/mobile-menu-qa.yml
          git diff --cached --check
          git commit -m "Refine mobile menu hierarchy and alignment"
          git push origin HEAD:friday-build
