name: PDP Design Audit

on:
  push:
    branches: [friday-build]
    paths-ignore:
      - '.pdp-design-audit-status.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: friday-build
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: npm install playwright@1.55.0 >/dev/null 2>&1
      - name: Wait for Shopify sync
        run: sleep 12
      - name: Audit PDP
        env:
          STORE_URL: https://il1m2791s4dmofov-108268650782.shopifypreview.com
        run: |
          cat > qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          fs.mkdirSync('pdp-design-audit',{recursive:true});
          const executablePath=fs.existsSync('/usr/bin/google-chrome')?'/usr/bin/google-chrome':undefined;
          const browser=await chromium.launch({headless:true,executablePath});
          const seed=await browser.newPage({viewport:{width:1280,height:800}});
          await seed.goto(`${process.env.STORE_URL}/collections/all?pdpseed=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});
          await seed.waitForLoadState('networkidle',{timeout:20000}).catch(()=>{});
          const href=await seed.locator('.fp-shop-card').first().getAttribute('href');
          if(!href) throw new Error('No product link found');
          await seed.close();
          const productUrl=new URL(href,process.env.STORE_URL).toString();
          const configs=[['desktop-1440',1440,1000],['laptop-1280',1280,800],['tablet-1024',1024,768],['tablet-820',820,1180],['mobile-390',390,844],['mobile-320',320,700]];
          const report=[]; let pass=true;
          for(const [name,width,height] of configs){
            const ctx=await browser.newContext({viewport:{width,height},deviceScaleFactor:1});
            const page=await ctx.newPage();
            await page.goto(`${productUrl}${productUrl.includes('?')?'&':'?'}pdpaudit=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForLoadState('networkidle',{timeout:20000}).catch(()=>{});
            await page.waitForTimeout(700);
            const top=await page.evaluate(()=>{
              const rect=s=>{const e=document.querySelector(s);if(!e)return null;const b=e.getBoundingClientRect();return {x:+b.x.toFixed(1),y:+b.y.toFixed(1),w:+b.width.toFixed(1),h:+b.height.toFixed(1),bottom:+b.bottom.toFixed(1)}};
              const details=document.querySelector('.fp-pdp__details');
              const media=document.querySelector('.fp-pdp__media');
              const gallery=document.querySelector('.fp-pdp__gallery');
              const img=document.querySelector('.fp-pdp__media img');
              const add=document.querySelector('.fp-pdp__add');
              return {
                url:location.href,
                header:rect('.fp-site-header'),grid:rect('.fp-pdp__grid'),gallery:rect('.fp-pdp__gallery'),media:rect('.fp-pdp__media'),image:rect('.fp-pdp__media img'),details:rect('.fp-pdp__details'),title:rect('.fp-pdp__title'),add:rect('.fp-pdp__add'),footer:rect('.fp-footer'),
                detailsPosition:details?getComputedStyle(details).position:null,
                detailsTop:details?getComputedStyle(details).top:null,
                mediaBg:media?getComputedStyle(media).backgroundColor:null,
                galleryBg:gallery?getComputedStyle(gallery).backgroundColor:null,
                addBg:add?getComputedStyle(add).backgroundColor:null,
                mediaCount:document.querySelectorAll('.fp-pdp__media').length,
                lightboxCount:document.querySelectorAll('dialog,[data-lightbox],[data-zoom],.lightbox,.product-media-modal').length,
                recommendationCount:document.querySelectorAll('product-recommendations,.product-recommendations,[data-product-recommendations],.related-products').length,
                dynamicCheckoutCount:document.querySelectorAll('.shopify-payment-button,[data-shopify="payment-button"]').length,
                descHeight:rect('.fp-pdp__description')?.h||0,
                accordionCount:document.querySelectorAll('.fp-pdp__accordion').length,
                overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2,
                brokenImages:[...document.images].filter(i=>i.complete&&i.naturalWidth===0).length
              };
            });
            await page.screenshot({path:`pdp-design-audit/${name}-top.png`,fullPage:false});
            if(width>=750){
              await page.evaluate(()=>window.scrollTo(0,Math.min(document.documentElement.scrollHeight*0.32,1000)));
              await page.waitForTimeout(250);
              const mid=await page.evaluate(()=>{
                const rect=s=>{const e=document.querySelector(s);if(!e)return null;const b=e.getBoundingClientRect();return {x:+b.x.toFixed(1),y:+b.y.toFixed(1),w:+b.width.toFixed(1),h:+b.height.toFixed(1),bottom:+b.bottom.toFixed(1)}};
                const imgs=[...document.querySelectorAll('.fp-pdp__media')].map(e=>{const b=e.getBoundingClientRect();return {top:+b.top.toFixed(1),bottom:+b.bottom.toFixed(1)}});
                return {scrollY:+scrollY.toFixed(1),details:rect('.fp-pdp__details'),gallery:rect('.fp-pdp__gallery'),visibleMedia:imgs.filter(r=>r.bottom>0&&r.top<innerHeight).length,firstMedia:imgs[0]||null};
              });
              top.mid=mid;
              await page.screenshot({path:`pdp-design-audit/${name}-mid.png`,fullPage:false});
            }
            await page.screenshot({path:`pdp-design-audit/${name}-full.png`,fullPage:true});
            if(top.overflow||top.brokenImages)pass=false;
            report.push({name,width,height,...top});
            await ctx.close();
          }
          await browser.close();
          const out={pass,productUrl,report};
          fs.writeFileSync('pdp-design-audit/report.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify(out,null,2));
          if(!pass)process.exitCode=1;
          EOF
          node qa.mjs
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdp-design-audit
          path: pdp-design-audit/
          retention-days: 2
      - name: Record result
        if: always()
        run: |
          python - <<'PY'
          import json,os
          try:data=json.load(open('pdp-design-audit/report.json'))
          except Exception as e:data={'pass':False,'error':str(e)}
          data['run_id']=int(os.environ['GITHUB_RUN_ID']);data['source_sha']=os.environ['GITHUB_SHA']
          json.dump(data,open('.pdp-design-audit-status.json','w'),indent=2)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .pdp-design-audit-status.json
          git commit -m 'Record PDP design audit [skip ci]' || exit 0
          git pull --rebase origin friday-build
          git push origin HEAD:friday-build
