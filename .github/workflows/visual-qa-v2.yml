name: Friday Prints Draft Browser QA

on:
  workflow_dispatch:
  push:
    branches:
      - friday-build

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Allow Shopify preview sync
        run: sleep 20
      - name: Render and audit connected Shopify draft
        env:
          STORE_URL: https://wy9z7gjpgosgm5mi-108268650782.shopifypreview.com
        run: |
          cat > qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          fs.mkdirSync('visual-qa-v2', { recursive: true });
          const browser = await chromium.launch({ headless: true });
          const configs = [
            ['desktop-1440', 1440, 1000],
            ['laptop-1280', 1280, 900],
            ['tablet-landscape-1024', 1024, 768],
            ['tablet-portrait-820', 820, 1180],
            ['mobile-390', 390, 844],
            ['mobile-320', 320, 700]
          ];
          const sections = [
            ['header', '.fp-site-header'],
            ['hero', '.fp-hero'],
            ['prints', '.fp-collection'],
            ['story', '.fp-story'],
            ['facts', '.fp-benefits'],
            ['newsletter', '.fp-newsletter'],
            ['footer', '.fp-footer']
          ];
          const report = [];
          let failed = false;

          for (const [name, width, height] of configs) {
            const ctx = await browser.newContext({ viewport: { width, height }, deviceScaleFactor: 1 });
            const page = await ctx.newPage();
            const consoleErrors = [];
            const requestFailures = [];
            page.on('console', m => { if (m.type() === 'error') consoleErrors.push(m.text()); });
            page.on('requestfailed', r => requestFailures.push({ url: r.url(), error: r.failure()?.errorText || 'failed' }));

            const resp = await page.goto(process.env.STORE_URL, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForLoadState('networkidle', { timeout: 30000 }).catch(() => {});
            await page.evaluate(async () => { if (document.fonts?.ready) await document.fonts.ready; });
            await page.waitForTimeout(1000);

            // Scroll each major section into view. This both validates real navigation through the page
            // and gives Shopify lazy-loaded images a chance to resolve before image-health checks.
            for (const [label, selector] of sections) {
              const locator = page.locator(selector).first();
              if (await locator.count()) {
                await locator.scrollIntoViewIfNeeded().catch(() => {});
                await page.waitForTimeout(250);
                await locator.screenshot({ path: `visual-qa-v2/${name}-${label}.png` }).catch(() => {});
              }
            }
            await page.locator('.fp-site-header').first().scrollIntoViewIfNeeded().catch(() => {});
            await page.waitForTimeout(500);

            const metrics = await page.evaluate(() => {
              const qs = s => document.querySelector(s);
              const docRect = s => {
                const e = qs(s);
                if (!e) return null;
                const r = e.getBoundingClientRect();
                const y = r.top + window.scrollY;
                return { x:+r.x.toFixed(1), y:+y.toFixed(1), width:+r.width.toFixed(1), height:+r.height.toFixed(1), bottom:+(y+r.height).toFixed(1) };
              };
              const brokenImages = [...document.images]
                .filter(i => i.complete && i.naturalWidth === 0)
                .map(i => ({ src: i.currentSrc || i.src, alt: i.alt }));
              const pendingLazyImages = [...document.images]
                .filter(i => !i.complete && i.loading === 'lazy')
                .map(i => ({ src: i.currentSrc || i.src, alt: i.alt }));
              const navLabels = [...document.querySelectorAll('.fp-nav__links a')].map(a => a.textContent.trim());
              const candidates = [document.documentElement, document.body, document.querySelector('.page-wrapper'), document.querySelector('#MainContent')].filter(Boolean);
              const scrollContainers = candidates.map(e => {
                const cs = getComputedStyle(e);
                return {
                  tag: e.tagName,
                  id: e.id || '',
                  className: typeof e.className === 'string' ? e.className : '',
                  overflowY: cs.overflowY,
                  clientHeight: e.clientHeight,
                  scrollHeight: e.scrollHeight
                };
              });
              return {
                title: document.title,
                bodyText: document.body.innerText.slice(0, 1600),
                scrollWidth: Math.max(document.documentElement.scrollWidth, document.body.scrollWidth),
                clientWidth: document.documentElement.clientWidth,
                documentScrollHeight: document.documentElement.scrollHeight,
                bodyScrollHeight: document.body.scrollHeight,
                scrollContainers,
                brokenImages,
                pendingLazyImages,
                header: docRect('.fp-site-header'),
                hero: docRect('.fp-hero'),
                collection: docRect('.fp-collection'),
                story: docRect('.fp-story'),
                benefits: docRect('.fp-benefits'),
                newsletter: docRect('.fp-newsletter'),
                footer: docRect('.fp-footer'),
                productCount: document.querySelectorAll('.fp-product').length,
                navLabels,
                searchHref: qs('.fp-search')?.getAttribute('href') || null,
                cartHref: qs('.fp-cart')?.getAttribute('href') || null,
                mobileMenuLinks: document.querySelectorAll('.fp-mobile-menu a').length
              };
            });

            const passwordPage = /enter using password|password to enter|opening soon/i.test(metrics.bodyText);
            const overflow = metrics.scrollWidth > metrics.clientWidth + 2;
            const isMobile = width <= 749;
            const errors = [];

            if (passwordPage) errors.push('PASSWORD_PAGE_RENDERED');
            if (metrics.brokenImages.length) errors.push(`BROKEN_IMAGES:${metrics.brokenImages.length}`);
            if (overflow) errors.push(`HORIZONTAL_OVERFLOW:${metrics.scrollWidth}-${metrics.clientWidth}`);
            if (!metrics.header) errors.push('HEADER_MISSING');
            if (!metrics.hero) errors.push('HERO_MISSING');
            if (!metrics.collection) errors.push('PRINT_RAIL_MISSING');
            if (!metrics.story) errors.push('GIGI_STORY_MISSING');
            if (!metrics.newsletter) errors.push('NEWSLETTER_MISSING');
            if (!metrics.footer) errors.push('FRIDAY_FOOTER_MISSING');
            if (metrics.productCount < 3) errors.push(`TOO_FEW_PRODUCTS:${metrics.productCount}`);
            if (!metrics.searchHref) errors.push('SEARCH_LINK_MISSING');
            if (!metrics.cartHref) errors.push('CART_LINK_MISSING');
            if (metrics.collection && metrics.story && metrics.collection.y > metrics.story.y) errors.push('PRINTS_NOT_BEFORE_STORY');
            if (isMobile && metrics.mobileMenuLinks < 4) errors.push(`MOBILE_MENU_TOO_SHORT:${metrics.mobileMenuLinks}`);
            if (isMobile && metrics.hero && metrics.hero.height > 900) errors.push(`MOBILE_HERO_TOO_TALL:${metrics.hero.height}`);

            if (errors.length) failed = true;
            await page.screenshot({ path: `visual-qa-v2/${name}-viewport.png`, fullPage: false });
            if (width < 900) await page.screenshot({ path: `visual-qa-v2/${name}-full.png`, fullPage: true });
            fs.writeFileSync(`visual-qa-v2/${name}.html`, await page.content());
            report.push({ name, width, height, httpStatus: resp?.status() ?? null, url: page.url(), metrics, consoleErrors, requestFailures, errors });
            await ctx.close();
          }

          await browser.close();
          fs.writeFileSync('visual-qa-v2/report.json', JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report, null, 2));
          if (failed) process.exitCode = 1;
          EOF
          node qa.mjs
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: friday-prints-draft-browser-qa
          path: visual-qa-v2/
          retention-days: 7
