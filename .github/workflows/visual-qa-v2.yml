name: Friday Prints Draft Browser QA

on:
  workflow_dispatch:
  push:
    branches:
      - friday-build

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Render and audit connected Shopify draft
        env:
          STORE_URL: https://bs166sge513c46zw-108268650782.shopifypreview.com
        run: |
          cat > qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          fs.mkdirSync('visual-qa-v2', { recursive: true });
          const browser = await chromium.launch({ headless: true });
          const configs = [
            ['desktop-1440', 1440, 1000],
            ['laptop-1280', 1280, 900],
            ['tablet-landscape-1024', 1024, 768],
            ['tablet-portrait-820', 820, 1180],
            ['mobile-390', 390, 844],
            ['mobile-320', 320, 700]
          ];
          const sections = [
            ['header', '.fp-site-header'],
            ['hero', '.fp-hero'],
            ['prints', '.fp-collection'],
            ['story', '.fp-story'],
            ['at-home', '.fp-at-home'],
            ['facts', '.fp-benefits'],
            ['newsletter', '.fp-newsletter'],
            ['footer', '.fp-footer']
          ];
          const report = [];
          let failed = false;

          for (const [name, width, height] of configs) {
            const ctx = await browser.newContext({ viewport: { width, height }, deviceScaleFactor: 1 });
            const page = await ctx.newPage();
            const consoleErrors = [];
            const requestFailures = [];
            page.on('console', m => { if (m.type() === 'error') consoleErrors.push(m.text()); });
            page.on('requestfailed', r => requestFailures.push({ url: r.url(), error: r.failure()?.errorText || 'failed' }));

            const resp = await page.goto(process.env.STORE_URL, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForLoadState('networkidle', { timeout: 30000 }).catch(() => {});
            await page.evaluate(async () => { if (document.fonts?.ready) await document.fonts.ready; });
            await page.waitForTimeout(1200);

            for (const [label, selector] of sections) {
              const locator = page.locator(selector).first();
              if (await locator.count()) {
                await locator.scrollIntoViewIfNeeded().catch(() => {});
                await page.waitForTimeout(200);
                await locator.screenshot({ path: `visual-qa-v2/${name}-${label}.png` }).catch(() => {});
              }
            }
            await page.locator('.fp-site-header').first().scrollIntoViewIfNeeded().catch(() => {});
            await page.waitForTimeout(350);

            const metrics = await page.evaluate(() => {
              const qs = s => document.querySelector(s);
              const rect = s => {
                const e = qs(s);
                if (!e) return null;
                const r = e.getBoundingClientRect();
                return { x:+r.x.toFixed(1), y:+r.y.toFixed(1), width:+r.width.toFixed(1), height:+r.height.toFixed(1), right:+r.right.toFixed(1), bottom:+r.bottom.toFixed(1) };
              };
              const picture = qs('.fp-hero__scene--composite picture');
              const transform = picture ? getComputedStyle(picture).transform : null;
              let compositeScale = null;
              if (transform && transform !== 'none') {
                const m = transform.match(/matrix\(([^)]+)\)/);
                if (m) compositeScale = +m[1].split(',')[0].trim();
              }
              const compositeImg = qs('.fp-hero__scene--composite img');
              const brokenImages = [...document.images]
                .filter(i => i.complete && i.naturalWidth === 0)
                .map(i => ({ src: i.currentSrc || i.src, alt: i.alt }));
              return {
                title: document.title,
                bodyText: document.body.innerText.slice(0, 2200),
                scrollWidth: Math.max(document.documentElement.scrollWidth, document.body.scrollWidth),
                clientWidth: document.documentElement.clientWidth,
                brokenImages,
                header: rect('.fp-site-header'),
                hero: rect('.fp-hero'),
                heroArtMode: qs('.fp-hero')?.dataset.artMode || null,
                heroComposite: rect('.fp-hero__scene--composite'),
                heroCompositeImage: rect('.fp-hero__scene--composite img'),
                heroCompositePictureTransform: transform,
                heroCompositeScale: compositeScale,
                heroCompositeNaturalWidth: compositeImg?.naturalWidth || 0,
                heroCompositeNaturalHeight: compositeImg?.naturalHeight || 0,
                collection: rect('.fp-collection'),
                story: rect('.fp-story'),
                atHome: rect('.fp-at-home'),
                benefits: rect('.fp-benefits'),
                newsletter: rect('.fp-newsletter'),
                footer: rect('.fp-footer'),
                productCount: document.querySelectorAll('.fp-product').length,
                atHomeSceneCount: document.querySelectorAll('.fp-at-home__scene').length,
                navLabels: [...document.querySelectorAll('.fp-nav__links a')].map(a => a.textContent.trim()),
                searchControlPresent: !!qs('.fp-search'),
                cartHref: qs('.fp-cart')?.getAttribute('href') || null,
                mobileMenuLinks: document.querySelectorAll('.fp-mobile-menu a').length
              };
            });

            const errors = [];
            const passwordPage = /enter using password|password to enter|opening soon/i.test(metrics.bodyText);
            const isMobile = width <= 749;
            if (resp?.status() !== 200) errors.push(`HTTP_STATUS:${resp?.status() ?? 'none'}`);
            if (passwordPage) errors.push('PASSWORD_PAGE_RENDERED');
            if (metrics.brokenImages.length) errors.push(`BROKEN_IMAGES:${metrics.brokenImages.length}`);
            if (metrics.scrollWidth > metrics.clientWidth + 2) errors.push(`HORIZONTAL_OVERFLOW:${metrics.scrollWidth}-${metrics.clientWidth}`);
            if (!metrics.header) errors.push('HEADER_MISSING');
            if (!metrics.hero) errors.push('HERO_MISSING');
            if (metrics.heroArtMode !== 'composite_image') errors.push(`WRONG_HERO_MODE:${metrics.heroArtMode}`);
            if (!metrics.heroComposite) errors.push('COMPOSITE_HERO_MISSING');
            if (!metrics.heroCompositeImage || !metrics.heroCompositeNaturalWidth) errors.push('COMPOSITE_IMAGE_MISSING');
            if ((width === 1440 || width === 1280) && !(metrics.heroCompositeScale >= 1.13 && metrics.heroCompositeScale <= 1.15)) {
              errors.push(`DESKTOP_COMPOSITE_SCALE_NOT_SYNCED:${metrics.heroCompositeScale}`);
            }
            if (!metrics.collection) errors.push('PRINT_RAIL_MISSING');
            if (!metrics.story) errors.push('GIGI_STORY_MISSING');
            if (!metrics.atHome) errors.push('FRIDAY_AT_HOME_MISSING');
            if (!metrics.benefits) errors.push('PRINT_FACTS_MISSING');
            if (!metrics.newsletter) errors.push('NEWSLETTER_MISSING');
            if (!metrics.footer) errors.push('FRIDAY_FOOTER_MISSING');
            if (!metrics.navLabels.includes('world of GiGi')) errors.push(`GIGI_NAV_CASING:${metrics.navLabels.join('|')}`);
            if (metrics.productCount < 3) errors.push(`TOO_FEW_PRODUCTS:${metrics.productCount}`);
            if (metrics.atHomeSceneCount !== 3) errors.push(`AT_HOME_SCENES:${metrics.atHomeSceneCount}`);
            if (!metrics.searchControlPresent) errors.push('SEARCH_CONTROL_MISSING');
            if (!metrics.cartHref) errors.push('CART_LINK_MISSING');
            if (isMobile && metrics.mobileMenuLinks < 4) errors.push(`MOBILE_MENU_TOO_SHORT:${metrics.mobileMenuLinks}`);
            if (isMobile && metrics.hero && metrics.hero.height > 900) errors.push(`MOBILE_HERO_TOO_TALL:${metrics.hero.height}`);

            if (errors.length) failed = true;
            await page.screenshot({ path: `visual-qa-v2/${name}-viewport.png`, fullPage: false });
            if (width < 900) await page.screenshot({ path: `visual-qa-v2/${name}-full.png`, fullPage: true });
            fs.writeFileSync(`visual-qa-v2/${name}.html`, await page.content());
            report.push({ name, width, height, httpStatus: resp?.status() ?? null, url: page.url(), metrics, consoleErrors, requestFailures, errors });
            await ctx.close();
          }

          await browser.close();
          fs.writeFileSync('visual-qa-v2/report.json', JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report, null, 2));
          if (failed) process.exitCode=1;
          EOF
          node qa.mjs
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: friday-prints-draft-browser-qa
          path: visual-qa-v2/
          retention-days: 7
