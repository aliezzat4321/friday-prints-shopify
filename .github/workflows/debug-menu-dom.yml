name: Friday Prints Menu DOM Trace

on:
  push:
    branches: [friday-build]
    paths: ['.github/workflows/debug-menu-dom.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Trace visible menu elements
        env:
          STORE_URL: https://il1m2791s4dmofov-108268650782.shopifypreview.com
        run: |
          cat > trace.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844}});
          await page.goto(process.env.STORE_URL,{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForLoadState('networkidle',{timeout:25000}).catch(()=>{});
          await page.waitForTimeout(700);
          await page.locator('.fp-menu > summary').first().click();
          await page.waitForTimeout(500);
          const data=await page.evaluate(()=>{
            const norm=s=>(s||'').replace(/\s+/g,' ').trim();
            const visible=el=>{const s=getComputedStyle(el),r=el.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity||1)>.01&&r.width>0&&r.height>0&&r.bottom>0&&r.top<innerHeight};
            const describe=el=>{const r=el.getBoundingClientRect(),s=getComputedStyle(el);return {tag:el.tagName.toLowerCase(),id:el.id||'',class:typeof el.className==='string'?el.className:'',text:norm(el.innerText||el.textContent).slice(0,180),rect:{x:r.x,y:r.y,width:r.width,height:r.height},display:s.display,position:s.position,zIndex:s.zIndex,fontSize:s.fontSize,parentTag:el.parentElement?.tagName?.toLowerCase()||'',parentId:el.parentElement?.id||'',parentClass:typeof el.parentElement?.className==='string'?el.parentElement.className:''};};
            const visibleEls=[...document.querySelectorAll('body *')].filter(visible);
            const brand=visibleEls.filter(el=>{const t=norm(el.innerText||el.textContent).toLowerCase();return (t.includes('friday')&&t.includes('prints.art'))||t==='friday'||t==='prints.art';}).map(describe);
            const bottom=visibleEls.filter(el=>{const t=norm(el.innerText||el.textContent).toLowerCase();return t.includes('@fridayprints.art')||t.includes('cairo')||t.includes('everywhere')||t.includes('limited-edition prints');}).map(describe);
            return {brand,bottom,bodyClass:document.body.className,headerCount:document.querySelectorAll('[id^="FridayHeader-"]').length,logoCount:document.querySelectorAll('.fp-logo').length,mobileBrandCount:document.querySelectorAll('.fp-mobile-menu__brand').length,footerCount:document.querySelectorAll('.fp-footer').length};
          });
          console.log(JSON.stringify(data,null,2));
          await page.screenshot({path:'trace.png'});
          await browser.close();
          EOF
          node trace.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: menu-dom-trace
          path: trace.png
          retention-days: 2
