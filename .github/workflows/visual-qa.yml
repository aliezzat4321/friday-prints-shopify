name: Visual QA

on:
  push:
    branches: [friday-build]
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Capture desktop and mobile
        env:
          TARGET_URL: https://3ywsb3-5k.myshopify.com/
        run: |
          cat > capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const url = process.env.TARGET_URL;
          fs.mkdirSync('visual-qa', { recursive: true });
          const browser = await chromium.launch({headless:true});
          async function shot(name, width, height, mobile=false){
            const context = await browser.newContext({ viewport:{width,height}, deviceScaleFactor:1, isMobile:mobile });
            const page = await context.newPage();
            await page.goto(url, {waitUntil:'networkidle', timeout:60000});
            await page.waitForTimeout(2500);
            await page.screenshot({path:`visual-qa/${name}.png`, fullPage:true});
            fs.writeFileSync(`visual-qa/${name}.html`, await page.content());
            await context.close();
          }
          await shot('desktop-1440',1440,1000,false);
          await shot('mobile-390',390,844,true);
          await browser.close();
          EOF
          node capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: visual-qa-${{ github.sha }}
          path: visual-qa/
          retention-days: 7
