name: Cleanup hidden defaults once

on:
  push:
    branches: [friday-build]
    paths:
      - '.github/workflows/cleanup-hidden-defaults-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: friday-build
          fetch-depth: 0
      - name: Replace stale reset defaults
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              Path('sections/friday-product.liquid'),
              Path('sections/friday-page.liquid'),
          ]
          old_delivery = 'Delivery typically takes 3–7 working days once your print has been produced and is ready to ship.'
          new_delivery = 'We currently ship across Egypt, with delivery taking up to 2 weeks ✨ But if you’re a little farther away, don’t worry — send us an email and GiGi will do her best to make it happen for you. 💌 Because GiGi loves seeing her creations travel.'
          old_email = 'Eldemirdsh@gmail.com'
          new_email = 'info@fridayprints.art'

          replacements = 0
          for path in files:
              text = path.read_text()
              replacements += text.count(old_delivery)
              replacements += text.count(old_email)
              text = text.replace(old_delivery, new_delivery).replace(old_email, new_email)
              path.write_text(text)

          if replacements < 3:
              raise SystemExit(f'Expected at least 3 stale defaults, found {replacements}. Refusing partial cleanup.')
          print(f'Updated {replacements} stale defaults.')
          PY

          git diff --check
          git diff -- sections/friday-product.liquid sections/friday-page.liquid
      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet -- sections/friday-product.liquid sections/friday-page.liquid; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sections/friday-product.liquid sections/friday-page.liquid
          git commit -m 'Clean hidden storefront defaults [skip ci]'
          for attempt in 1 2 3 4; do
            git pull --rebase origin friday-build && git push origin HEAD:friday-build && exit 0
            echo "Retrying push ($attempt/4)..."
            sleep $((attempt * 3))
          done
          exit 1
