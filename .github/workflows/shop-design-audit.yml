name: Shop All Design Audit

on:
  push:
    branches: [friday-build]
    paths-ignore:
      - '.shop-design-audit-status.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: friday-build
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: npm install playwright@1.55.0 >/dev/null 2>&1
      - name: Wait for Shopify sync
        run: sleep 12
      - name: Audit Shop All
        env:
          STORE_URL: https://il1m2791s4dmofov-108268650782.shopifypreview.com
        run: |
          cat > qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          fs.mkdirSync('shop-design-audit',{recursive:true});
          const executablePath=fs.existsSync('/usr/bin/google-chrome')?'/usr/bin/google-chrome':undefined;
          const browser=await chromium.launch({headless:true,executablePath});
          const configs=[['desktop-1440',1440,1000],['laptop-1280',1280,800],['tablet-1024',1024,768],['tablet-820',820,1180],['mobile-390',390,844],['mobile-320',320,700]];
          const report=[]; let pass=true;
          for(const [name,width,height] of configs){
            const ctx=await browser.newContext({viewport:{width,height},deviceScaleFactor:1});
            const page=await ctx.newPage();
            await page.goto(`${process.env.STORE_URL}/collections/all?audit=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForLoadState('networkidle',{timeout:20000}).catch(()=>{});
            await page.waitForTimeout(700);
            const m=await page.evaluate(()=>{
              const r=s=>{const e=document.querySelector(s);if(!e)return null;const b=e.getBoundingClientRect();return {x:+b.x.toFixed(1),y:+b.y.toFixed(1),w:+b.width.toFixed(1),h:+b.height.toFixed(1)}};
              const cards=[...document.querySelectorAll('.fp-shop-card')];
              const media=cards[0]?.querySelector('.fp-shop-card__media');
              const title=document.querySelector('.fp-shop h1');
              const grid=document.querySelector('.fp-shop__grid');
              const styles=grid?getComputedStyle(grid):null;
              return {
                url:location.href,
                header:r('.fp-site-header'),
                shop:r('.fp-shop'),
                head:r('.fp-shop__head'),
                tools:r('.fp-shop__tools'),
                grid:r('.fp-shop__grid'),
                firstCard:r('.fp-shop-card'),
                firstMedia:r('.fp-shop-card__media'),
                footer:r('.fp-footer'),
                titleFont:title?parseFloat(getComputedStyle(title).fontSize):null,
                productCount:cards.length,
                gridColumns:styles?.gridTemplateColumns||null,
                columnGap:styles?.columnGap||null,
                rowGap:styles?.rowGap||null,
                overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2,
                bodyHeight:document.documentElement.scrollHeight,
                firstFive:cards.slice(0,5).map(c=>({title:c.querySelector('h2')?.textContent?.trim(),media:rNode(c.querySelector('.fp-shop-card__media'))}))
              };
              function rNode(e){if(!e)return null;const b=e.getBoundingClientRect();return {w:+b.width.toFixed(1),h:+b.height.toFixed(1)}}
            });
            if(m.overflow||m.productCount===0)pass=false;
            await page.screenshot({path:`shop-design-audit/${name}-full.png`,fullPage:true});
            await page.screenshot({path:`shop-design-audit/${name}-top.png`,fullPage:false});
            report.push({name,width,height,...m});
            await ctx.close();
          }
          await browser.close();
          const out={pass,report};
          fs.writeFileSync('shop-design-audit/report.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify(out,null,2));
          if(!pass)process.exitCode=1;
          EOF
          node qa.mjs
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shop-design-audit
          path: shop-design-audit/
          retention-days: 2
      - name: Record result
        if: always()
        run: |
          python - <<'PY'
          import json,os
          try:data=json.load(open('shop-design-audit/report.json'))
          except Exception as e:data={'pass':False,'error':str(e)}
          data['run_id']=int(os.environ['GITHUB_RUN_ID']);data['source_sha']=os.environ['GITHUB_SHA']
          json.dump(data,open('.shop-design-audit-status.json','w'),indent=2)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .shop-design-audit-status.json
          git commit -m 'Record Shop All design audit [skip ci]' || exit 0
          git pull --rebase origin friday-build
          git push origin HEAD:friday-build
